spring.application.name=challengebackend

jwt.secret=${JWT_SECRET:change-this-super-secret-key-for-jwt-signing-in-dev-0123456789}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

reserva.hold-duration-seconds=${RESERVA_HOLD_DURATION_SECONDS:600}

stripe.secret-key=${STRIPE_SECRET_KEY:sk_test_placeholder}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

tmdb.api-key=${TMDB_API_KEY:}
tmdb.base-url=${TMDB_BASE_URL:https://api.themoviedb.org/3}

tmdb.sync.default-session-time=${TMDB_SYNC_SESSION_TIME:20:00}
tmdb.sync.default-preco=${TMDB_SYNC_DEFAULT_PRECO:30.00}
tmdb.sync.default-local=${TMDB_SYNC_DEFAULT_LOCAL:Sala a definir}
tmdb.sync.default-fileiras=${TMDB_SYNC_DEFAULT_FILEIRAS:10}
tmdb.sync.default-colunas=${TMDB_SYNC_DEFAULT_COLUNAS:10}
tmdb.sync.organizer-id=${TMDB_SYNC_ORGANIZER_ID:66666666-6666-6666-6666-666666666666}
